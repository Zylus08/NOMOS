[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nomos"
version = "0.1.0"
description = "NOMOS — Neural & Symbolic Discovery of Physical Laws (Milestone M1 Foundation)"
readme = "README.md"
authors = [
    { name = "Saksham Mishra", email = "mishrasaksham080705@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0,<2.0.0",
    "scipy>=1.10.0",
    "sympy>=1.12.0",
    "pysindy>=2.0.0",
    "matplotlib>=3.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
nomos = "nomos.cli:main"

[tool.setuptools.packages.find]
include = ["nomos*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
